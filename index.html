<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Template</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
            color: #333;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: transparent;
            color: #6c757d;
            border: 2px solid #6c757d;
        }
        .btn-secondary:hover {
            background-color: #6c757d;
            color: white;
        }

        .btn-link {
            background-color: #28a745;
            color: white;
        }
        .btn-link:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Webpage</h1>
    <p>This is a standard boilerplate HTML5 structure containing essential metadata, custom styles, and clean button components.</p>

    <button type="button" class="btn btn-primary" onclick="alert('Primary action triggered!')">
        Click here to view 
      about the Side 
      Table Structure
    </button>

    <button type="button" class="btn btn-secondary">
        Close
    </button>

    <a href="https://example.com" class="btn btn-link">
        Go to Website
    </a>

    <script>
        console.log("Page layout loaded successfully.");
    </script>
</body>
</html>
